name: Release

# Publishes the package to nuget.org when a version tag is pushed.
#
# Procedure:
#   1. set <Version> in Reefact.LuxaforLightingDeviceController.csproj (e.g. 2.0.0)
#   2. update CHANGELOG.md, merge everything into main
#   3. git tag v2.0.0 && git push origin v2.0.0
#
# Authentication uses nuget.org trusted publishing (OIDC): no long-lived API key is stored in
# the repository, the job exchanges a GitHub OIDC token for a short-lived key at push time.
# It needs, once:
#
#   - on nuget.org (Account > Trusted Publishing), a policy for this repository:
#       owner        Reefact
#       repository   luxafor-lighting-device-controller
#       workflow     .github/workflows/release.yml   (optional filter, recommended)
#       environment  nuget                           (optional filter, matches the job below)
#       tag filter   v*                              (optional filter, matches the trigger)
#   - the NUGET_USER secret (or repository variable), holding the nuget.org account name the
#     policy belongs to. Trust policies are attached to an individual account, so this is the
#     personal username of whoever created the policy, even when the package owner is the
#     Reefact organization.
#
# The job refuses to publish when the tag does not match the version of the project, so a
# mistyped tag cannot publish the wrong version, and it runs the tests and the package
# validation before pushing anything.

on:
  push:
    tags: [ 'v*' ]

permissions:
  id-token: write   # needed to request the GitHub OIDC token exchanged for a nuget.org key
  contents: write   # needed to create the GitHub release

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    runs-on: windows-latest
    # Publishing is bound to an environment: a required reviewer can be added on it
    # (Settings > Environments > nuget) to make every release manually approved.
    environment: nuget

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Source Link embeds the commit, it needs the full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check the nuget.org account is configured
        shell: pwsh
        env:
          # Accepted as a secret or as a repository variable: it is an account name, not a credential.
          NUGET_USER: ${{ secrets.NUGET_USER || vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw "NUGET_USER is not configured: add it in Settings > Secrets and variables > Actions, holding the nuget.org account name the trusted publishing policy belongs to."
          }
          Write-Host "Publishing as the nuget.org account $env:NUGET_USER."

      - name: Check the tag matches the version of the project
        shell: pwsh
        run: |
          $project = 'Reefact.LuxaforLightingDeviceController/Reefact.LuxaforLightingDeviceController.csproj'
          $version = (dotnet msbuild $project -getProperty:Version).Trim()
          $expectedTag = "v$version"
          $tag = '${{ github.ref_name }}'
          if ($tag -ne $expectedTag) {
            throw "Tag '$tag' does not match the version of the project ('$version', e.g. tag '$expectedTag'). Fix <Version> or the tag, then tag again."
          }
          Write-Host "Publishing version $version from tag $tag."

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Check the documentation examples are up to date
        shell: pwsh
        run: ./build/Sync-Snippets.ps1 -Check

      - name: Pack
        run: dotnet pack Reefact.LuxaforLightingDeviceController -c Release --no-build -o artifacts

      - name: Validate package content
        shell: pwsh
        run: ./build/Validate-Package.ps1 -ArtifactsDirectory artifacts

      # The package is published only if a real consumer can install it, compile against it and run.
      - name: Consume the package
        shell: pwsh
        run: ./build/Test-PackageConsumption.ps1 -ArtifactsDirectory artifacts

      # Kept right before the push: the key returned by the token service is short-lived.
      - name: Log in to nuget.org (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER || vars.NUGET_USER }}

      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # The matching .snupkg sitting next to the .nupkg is pushed along automatically.
          $package = (Get-ChildItem artifacts -Filter *.nupkg | Select-Object -First 1).FullName
          Write-Host "Pushing $package"
          dotnet nuget push $package --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag    = '${{ github.ref_name }}'
          $assets = (Get-ChildItem artifacts -File | ForEach-Object { $_.FullName })
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists, uploading the packages to it."
            gh release upload $tag $assets --clobber
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag $assets --title $tag --generate-notes
          }
